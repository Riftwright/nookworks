# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[1.21.1,1.21.2)
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=21.1.256
# The oldest NeoForge the jar starts on (neoforge.mods.toml): 21.1.219, what Create 6.0.10 and Farmer's Delight 1.3
# ask for and many packs still carry. Kept true by running the tests on it before a release:
#   ./tools/gradle.sh runGameTestServer -Pneo_version=21.1.219   (in a copy where no game runs)
neo_version_floor=21.1.219

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=nookworks
# The human-readable display name for the mod.
mod_name=Nookworks
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=MIT
# The mod version. See https://semver.org/
mod_version=1.7.1
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=dev.nookworks
# Public display name only. Never put a real name or email here.
mod_authors=Riftwright

# Optional integration (compile against the API, JEI itself only in dev runs)
jei_version=19.70.0.469
jade_version=15.10.6+neoforge
# The oldest of each the mod is known to work with: an older one is refused at start, with a message naming the
# version needed, rather than failing on a missing method in play. The plugins compile against these very versions
# (./tools/gradle.sh compileJava -Pjei_version=19.21.0.247 -Pjade_version=15.10.0+neoforge; tools/port1211/tx/jei.py
# keeps the JEI plugin to what 19.21 has).
jei_version_floor=19.21.0.247
jade_version_floor=15.10.0
# Create (compile time only; dev.nookworks.compat.create) and the libraries its classes need to compile against
create_version=6.0.10-281
ponder_version=1.0.82+mc1.21.1
flywheel_version=1.0.6
# The oldest Create the Create part is known to work with (what it is built against)
create_version_floor=6.0.10
