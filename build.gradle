plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // JEI (optional integration; see dev.nookworks.compat.jei)
    maven {
        name = "JEI"
        url = "https://maven.blamejared.com/"
        // net.mezzdev.config: the settings library JEI for 26.3 depends on (and carries inside its jar)
        content { includeGroup "mezz.jei"; includeGroup "net.mezzdev.config" }
    }
    // Jade (optional integration; see dev.nookworks.compat.jade). Jade publishes no separate API artifact.
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.3, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // A review copy (tools/review_worktree.ps1) runs beside other reviewers' and the user's game: its
    // run-agent/review.properties gives its client a smaller heap and the port of its own test server, so several fit
    // in memory at once and their servers do not collide. Without it: 4 GB, and the server's usual port.
    def review = new Properties()
    def reviewFile = project.file('run-agent/review.properties')
    if (reviewFile.exists()) {
        reviewFile.withInputStream { review.load(it) }
    }

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Iris (shaders) trips the render-pass validation a development game runs (never a player's): with it in
            // this folder's mods/, that validation is off, so shaders can be used here for screenshots.
            if (project.file('run/mods').listFiles()?.any { it.name.startsWith('iris') }) {
                systemProperty 'neoforge.disableBlaze3DValidation', 'true'  // the 26.3 name (was disableGlValidation)
            }
            // Sodium and Iris still name their logo the old way; a development game stops on a warning screen saying
            // so before the title screen (a player's game does not). Nothing is wrong: skip it.
            systemProperty 'neoforge.warnings.logofile.hide', 'true'
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Agent-only client for automated visual checks: separate game folder (never the user's worlds)
        // and loads the throwaway world "Nookworks Test" directly.
        agentClient {
            client()
            gameDirectory = project.file('run-agent')
            // Iris (shaders) trips the render-pass validation a development game runs (never a player's): with it in
            // this folder's mods/, that validation is off, so shaders can be used here for screenshots.
            if (project.file('run-agent/mods').listFiles()?.any { it.name.startsWith('iris') }) {
                systemProperty 'neoforge.disableBlaze3DValidation', 'true'  // the 26.3 name (was disableGlValidation)
            }
            // Sodium and Iris still name their logo the old way; a development game stops on a warning screen saying
            // so before the title screen (a player's game does not). Nothing is wrong: skip it.
            systemProperty 'neoforge.warnings.logofile.hide', 'true'
            // -PagentServer joins the local test server (runAgentServer) instead of opening the test world; with
            // -PagentServerPort=N, another copy's (a second player in a two-player check, from a second review copy).
            if (project.hasProperty('agentServer')) {
                // the server listens on IPv4 only
                programArguments.addAll '--quickPlayMultiplayer', '127.0.0.1:' + (project.findProperty('agentServerPort')
                        ?: review.getProperty('serverPort', '25565'))
            } else {
                // -PagentWorld=NAME opens another world of run-agent/saves (one made for gallery shots, on real terrain)
                programArguments.addAll '--quickPlaySingleplayer', project.findProperty('agentWorld') ?: 'Nookworks Test'
            }
            // -PagentName=NAME plays as NAME rather than Dev: the second player of a two-player check (the test server
            // is in offline mode, where the name alone tells two players apart).
            if (project.hasProperty('agentName')) {
                programArguments.addAll '--username', project.property('agentName').toString()
            }
            // Development-only input bridge (dev.nookworks.client.dev.AgentInput); never set for real play.
            systemProperty 'nookworks.agentInput', 'true'
            // The window stays hidden (no window, no taskbar button: the game never takes the user's focus or mouse,
            // and cannot be minimised by mistake); the bridge drives it and takes its shots from the game's own frame.
            // -PagentVisible shows it as a normal window, for watching or for a person to play in it; a hidden one
            // can also be shown for a while with `mcwin.ps1 show` (a window capture, filming, needs it shown).
            if (!project.hasProperty('agentVisible')) {
                systemProperty 'nookworks.agentHidden', 'true'
                // SDL shows a window without activating it, should it be shown (it is hidden as it is first shown)
                environment 'SDL_WINDOW_ACTIVATE_WHEN_SHOWN', '0'
            }
            // Several may run at once (reviewers each from their own worktree) beside the user's game: without a cap
            // each takes up to a quarter of the machine's memory.
            jvmArguments.add '-Xmx' + review.getProperty('heap', '4G')
            // -PagentWindow=1280x720 opens a bigger window, for listing screenshots; the default stays small.
            if (project.hasProperty('agentWindow')) {
                def size = project.property('agentWindow').toString().split('x')
                programArguments.addAll '--width', size[0], '--height', size[1]
            }
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Dedicated server for agent multiplayer checks, in its own folder (never run/, which holds the user's
        // worlds). Listens on 127.0.0.1 only and in offline mode, for the dev client (run-server/server.properties).
        agentServer {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
            // a test world for a player or two; several may run at once, one per review copy
            jvmArguments.add '-Xmx2G'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            // Its own folder, so a test run never touches run/ (the user's worlds and logs, maybe in use).
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // A hook of ours (or of any mod here) that finds no place in the game's code stops the test run at load, as it
            // stopped every game before 2026-10-23: in players' games such a hook is now left out (defaultRequire 0 in
            // nookworks.mixins.json, the user: クラッシュは避けたい), so this is where a Minecraft update or a clash shows.
            systemProperty 'mixin.debug.countInjections', 'true'
            // -PcaptureCompat makes this version's save-compatibility fixture (gametest/SaveCompat) instead of checking
            // the ones kept: every block of ours, filled, into data/nookworks/structure/compat/<version>
            if (project.hasProperty('captureCompat')) {
                systemProperty 'nookworks.captureCompat', project.file('src/main/resources/data/nookworks/structure/compat').absolutePath
                systemProperty 'nookworks.captureCompatName', project.mod_version.toString().replace('.', '_')
            }
            // For hunting a test that fails now and then: -PonlyTests=dark_matter_,if_mirror_ runs only the tests whose
            // names start so, and -PrepeatTests=40 runs each of them that many times, each in a batch of its own.
            if (project.hasProperty('onlyTests')) {
                systemProperty 'nookworks.onlyTests', project.property('onlyTests').toString()
            }
            if (project.hasProperty('repeatTests')) {
                systemProperty 'nookworks.repeatTests', project.property('repeatTests').toString()
            }
        }

        data {
            clientData()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    compileOnly "maven.modrinth:jade:${jade_version}"
    localRuntime "maven.modrinth:jade:${jade_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            jei_version_floor      : jei_version_floor,
            jade_version_floor     : jade_version_floor,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

// NeoForge's loading screen is a window of its own, up from the start, before any mod is loaded: a hidden agent
// client turns it off in its fml.toml (FML reads no switch for it from the command line), a visible one has it back.
def agentFmlConfig = project.file('run-agent/config/fml.toml')
def agentLoadingScreen = project.hasProperty('agentVisible')
tasks.matching { it.name == 'runAgentClient' }.configureEach {
    doFirst {
        def line = "earlyWindowControl = ${agentLoadingScreen}".toString()
        def text = agentFmlConfig.exists() ? agentFmlConfig.getText('UTF-8') : ''
        def setting = /(?m)^earlyWindowControl[ \t]*=[^\r\n]*/
        def changed = text =~ setting ? text.replaceAll(setting, line)
                : text + (text.isEmpty() || text.endsWith('\n') ? '' : '\n') + line + '\n'
        if (changed != text) {
            agentFmlConfig.parentFile.mkdirs()
            agentFmlConfig.setText(changed, 'UTF-8')
        }
    }
}

// The agent input bridge drives the dev client for automated visual checks. It is inert without
// -Dnookworks.agentInput=true, but there is no reason to ship it, so it is left out of the published jar, and the
// agent bot's planner (dev/nookworks/dev, which it and BotPathTests use) with it.
// The GameTests and their arena are only registered when the game runs in GameTest mode, and would be a fifth
// of the jar for nothing, so they are left out too. check_release.py makes sure nothing still links to either.
tasks.named('jar') {
    // MIT asks for its notice in every copy, and the jar is the copy players get
    var licenseName = "LICENSE_${mod_id}" // read here: the configuration cache keeps no project for the rename to ask
    from('LICENSE') { rename { licenseName } }
    exclude 'dev/nookworks/client/dev/**'
    exclude 'dev/nookworks/dev/**'
    exclude 'dev/nookworks/gametest/**'
    exclude 'data/nookworks/structure/arena.nbt'
    exclude 'data/nookworks/structure/compat/**' // the save-compatibility fixtures, for the GameTests only
    includeEmptyDirs = false // or the arena's folder ships empty, and the test packages' folders with it
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
